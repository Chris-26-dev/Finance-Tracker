name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lockfile was generated with legacy peer resolution
      # (react-day-picker@8 declares date-fns <4 as a peer).
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run lint
      # API tests run against in-memory PGlite; no secrets or database needed.
      - run: npm test
